name: Build module

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build HideCornerIcons.csproj -c Release

      - name: Package .bhm
        shell: pwsh
        run: |
          $out = Get-ChildItem -Recurse -Filter HideCornerIcons.dll -Path bin | Select-Object -First 1
          New-Item -ItemType Directory -Path pkg | Out-Null
          Copy-Item $out.FullName pkg/
          Copy-Item manifest.json pkg/
          Compress-Archive -Path pkg/* -DestinationPath HideCornerIcons.zip
          Move-Item HideCornerIcons.zip HideCornerIcons.bhm

      - uses: actions/upload-artifact@v4
        with:
          name: HideCornerIcons.bhm
          path: HideCornerIcons.bhm
